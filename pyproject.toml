[project]
name = "raft"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["aiohttp>=3.9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: поднимает настоящий кластер на локальных портах (медленнее)",
]
